# Garante que a versão do BTP -- uma linha SemVer só -- não divirja entre os
# lugares que a carregam: include/btp/version.hpp (a fonte), library.json (a
# cópia que o PlatformIO lê) e o project(VERSION) do CMake (que faz o parse da
# fonte). Ver docs/library.md secao 10.
name: version

on:
  push:
    paths:
      - include/btp/version.hpp
      - library.json
      - CMakeLists.txt
      - tools/version.py
      - .github/workflows/version.yml
  pull_request:
    paths:
      - include/btp/version.hpp
      - library.json
      - CMakeLists.txt
      - tools/version.py
      - .github/workflows/version.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # version.hpp vs library.json.
      - run: python tools/version.py --check

      # O configure do CMake faz o parse de version.hpp para o project(VERSION)
      # e recusa se library.json divergir; o build de btp::codec exercita o
      # static_assert que amarra kMaximumProtocolVersion ao MAJOR.
      - run: cmake -S . -B build -DBTP_ENABLE_AEAD=OFF -DBTP_BUILD_TESTS=OFF
      - run: cmake --build build --target btp_codec
