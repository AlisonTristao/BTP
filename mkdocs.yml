site_name: BTP — Binary Telemetry Protocol
site_description: >-
  The wire specification, shared library and conformance vectors for BTP: the
  binary telemetry and control protocol between embedded firmware and computer
  applications.
site_url: https://alisontristao.github.io/BTP/
repo_url: https://github.com/AlisonTristao/BTP
repo_name: AlisonTristao/BTP
edit_uri: blob/main/docs/

# A broken link, a page outside the nav or a missing anchor fails the build
# instead of becoming a silent warning. The book cross-references itself
# heavily, and a stale link is exactly the kind of defect that should stop CI.
strict: true

# strict alone only escalates WARNINGs. MkDocs reports an unresolved heading
# anchor at INFO by default, so a link to a section that was renamed would pass
# CI silently. Raising these two to warn is what makes strict mean what the
# comment above says it means.
validation:
  links:
    anchors: warn
    unrecognized_links: warn

theme:
  name: material
  language: en
  icon:
    logo: material/access-point-network
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer   # previous/next links: sequential book reading
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - search.share
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search:
      lang: en

# Rewrites, only at build time, the links that leave docs/ (source files,
# conformance vectors) into GitHub URLs. See mkdocs_hooks.py.
hooks:
  - mkdocs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Why BTP exists: why-btp.md
  - The model: model.md
  - The datagram: frame.md
  - Getting it across the link: fragmentation-and-transports.md
  - Encryption: encryption.md
  - Telemetry payloads: telemetry.md
  - Commands and discovery: commands.md
  - Session and terminal: session-and-terminal.md
  - Using the library: library.md
